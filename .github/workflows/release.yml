name: Build and release Windows installer

# Every push to main whose package.json version has no release yet is built and published.
# Installed apps compare against that version and offer the update ("Check for updates").
on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 2.0.1)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event.inputs.version }}" -ne "") { $version = "${{ github.event.inputs.version }}" }
          elseif ("${{ github.ref }}" -match "refs/tags/v(.+)") { $version = $matches[1] }
          else { $version = (Get-Content package.json | ConvertFrom-Json).version }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT

      - name: Skip if this version is already released
        id: exists
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "v${{ steps.version.outputs.VERSION }}" --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { echo "SKIP=true" >> $env:GITHUB_OUTPUT; echo "v${{ steps.version.outputs.VERSION }} already released; bump the version in package.json to ship an update." }
          else { echo "SKIP=false" >> $env:GITHUB_OUTPUT }
          exit 0

      - name: Set package version
        if: steps.exists.outputs.SKIP != 'true'
        run: npm version ${{ steps.version.outputs.VERSION }} --no-git-tag-version --allow-same-version

      - name: Install dependencies
        if: steps.exists.outputs.SKIP != 'true'
        run: npm ci

      - name: Run tests (Node)
        if: steps.exists.outputs.SKIP != 'true'
        run: npm test

      - name: Run tests (Electron runtime)
        if: steps.exists.outputs.SKIP != 'true'
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE = '1'
          npx electron --test test/unit.test.js test/api.test.js test/updater.test.js test/license.test.js

      - name: Build NSIS installer
        if: steps.exists.outputs.SKIP != 'true'
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Create release
        if: steps.exists.outputs.SKIP != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Vira Villas Rooms v${{ steps.version.outputs.VERSION }}
          files: dist/Vira-Villas-Rooms-Setup-*.exe
          body: |
            ## Vira Villas Rooms v${{ steps.version.outputs.VERSION }}

            Download `Vira-Villas-Rooms-Setup-${{ steps.version.outputs.VERSION }}.exe` and run it.
            No administrator rights, internet connection or database installation is needed.
            Installing over an older 2.x version keeps all data.

            Requirements: Windows 10 or 11, 64-bit, 4 GB RAM.
